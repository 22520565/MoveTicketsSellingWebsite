server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
        physical-strategy: com.movie.main.config.CamelCaseNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
        